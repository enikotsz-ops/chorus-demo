document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:9px;text-decoration:none\"><span style=\"width:28px;height:28px;border-radius:9px;background:#1B1A17;display:flex;align-items:center;justify-content:center;gap:2px\"><span style=\"width:2.5px;height:8px;border-radius:2px;background:#F6E08C\"><\u002Fspan><span style=\"width:2.5px;height:14px;border-radius:2px;background:#F6E08C\"><\u002Fspan><span style=\"width:2.5px;height:10px;border-radius:2px;background:#F6E08C\"><\u002Fspan><\u002Fspan><span style=\"font:600 19px/1 'Outfit',sans-serif;letter-spacing:-.01em\">Chorus<\u002Fspan><\u002Fa>\n<div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:flex-end\">\n<a href=\"#how\" style=\"font:500 14.5px 'Outfit',sans-serif;text-decoration:none;color:#6E695C\" style-hover=\"color:#1B1A17\">How it works<\u002Fa>\n<a href=\"#demo\" style=\"font:500 14.5px 'Outfit',sans-serif;text-decoration:none;color:#6E695C\" style-hover=\"color:#1B1A17\">Try it<\u002Fa>\n<a href=\"Chorus Soft Daylight.dc.html\" style=\"font:500 14.5px 'Outfit',sans-serif;text-decoration:none;color:#6E695C\" style-hover=\"color:#1B1A17\">See the app<\u002Fa>\n<a href=\"#waitlist\" style=\"font:500 14px 'Outfit',sans-serif;text-decoration:none;color:#fff;background:#1B1A17;padding:10px 18px;border-radius:14px\" style-hover=\"background:#33302A;color:#fff\">Join the waitlist<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fnav>\n\n<header id=\"top\" style=\"padding:20px 20px 0\">\n<div style=\"max-width:1200px;margin:0 auto;background:#FBF3D7;border-radius:40px;padding:clamp(48px,8vw,96px) clamp(24px,6vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:48px;align-items:center\">\n<div>\n<div style=\"font:500 12.5px/1 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8A8263;margin-bottom:20px\">KNOW YOUR PEOPLE<\u002Fdiv>\n<h1 style=\"margin:0 0 22px;font:300 clamp(44px,6.4vw,76px)/1.04 'Outfit',sans-serif;letter-spacing:-.03em\">One question.<br>A memory.<br><strong style=\"font-weight:600\">Together.<\u002Fstrong><\u002Fh1>\n<p style=\"margin:0 0 34px;font:400 18px/1.6 'DM Sans',sans-serif;color:#615C4F;max-width:480px;text-wrap:pretty\">Chorus asks your family &amp; close friends to share memories every week. Everyone answers in their own voice, and nobody hears anyone else's answer until they've given theirs.<\u002Fp>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<a href=\"#demo\" style=\"height:58px;padding:0 28px;border-radius:20px;background:#1B1A17;color:#fff;font:500 16px 'Outfit',sans-serif;text-decoration:none;display:flex;align-items:center\" style-hover=\"background:#33302A;color:#fff\">Share something<\u002Fa>\n<a href=\"#waitlist\" style=\"height:58px;padding:0 28px;border-radius:20px;background:#FFFFFF;color:#1B1A17;font:500 16px 'Outfit',sans-serif;text-decoration:none;display:flex;align-items:center\" style-hover=\"background:#F8F7F2\">Join the waitlist<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:30px;padding:28px;box-shadow:0 24px 60px rgba(120,100,40,.12);max-width:440px;justify-self:center;width:100%;box-sizing:border-box\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\"><span style=\"font:500 12px/1 'Outfit',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8A8263\">This week · Family history<\u002Fspan><span style=\"font:500 12px 'Outfit',sans-serif;color:#8A8263\">2 days left<\u002Fspan><\u002Fdiv>\n<div style=\"font:400 24px/1.3 'Outfit',sans-serif;letter-spacing:-.01em;margin-bottom:22px\">Who in our family history do you wish you'd asked more questions?<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;margin-bottom:22px\">\n<div style=\"display:flex\"><span style=\"width:36px;height:36px;border-radius:12px;background:#EFE4C0;color:#6B5E33;font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff\">M<\u002Fspan><span style=\"width:36px;height:36px;border-radius:12px;background:#DFE6EA;color:#54606A;font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px\">D<\u002Fspan><span style=\"width:36px;height:36px;border-radius:12px;background:#E3EADD;color:#57654F;font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px\">L<\u002Fspan><\u002Fdiv>\n<span style=\"font:400 13.5px 'DM Sans',sans-serif;color:#6E695C\">3 answered · waiting on you<\u002Fspan>\n<\u002Fdiv>\n<div style=\"background:#F8F7F2;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px\">\n<span style=\"width:52px;height:52px;border-radius:50%;background:#F6E08C;display:flex;align-items:center;justify-content:center;flex-shrink:0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1A17\" stroke-width=\"1.9\" stroke-linecap=\"round\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 10a7 7 0 0 0 14 0\"><\u002Fpath><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"21\"><\u002Fline><\u002Fsvg><\u002Fspan>\n<div style=\"display:flex;gap:4px;align-items:center;height:32px;flex:1\"><span style=\"width:4px;height:32px;border-radius:3px;background:#E0A93C;animation:bar 1.6s ease-in-out infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#F6E08C;animation:bar 1.6s ease-in-out .15s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#E0A93C;animation:bar 1.6s ease-in-out .3s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#F6E08C;animation:bar 1.6s ease-in-out .45s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#E0A93C;animation:bar 1.6s ease-in-out .6s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#F6E08C;animation:bar 1.6s ease-in-out .75s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#E0A93C;animation:bar 1.6s ease-in-out .9s infinite\"><\u002Fspan><span style=\"width:4px;height:32px;border-radius:3px;background:#F6E08C;animation:bar 1.6s ease-in-out 1.05s infinite\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"why\" style=\"padding:clamp(72px,10vw,120px) 24px 0\">\n<div style=\"max-width:1120px;margin:0 auto\">\n<div style=\"max-width:620px;margin-bottom:40px\">\n<h2 style=\"margin:0 0 14px;font:400 clamp(32px,4vw,44px)/1.12 'Outfit',sans-serif;letter-spacing:-.02em\">Group chats go quiet.<\u002Fh2>\n<p style=\"margin:0;font:400 17px/1.6 'DM Sans',sans-serif;color:#6E695C;text-wrap:pretty\">Nobody knows what to ask, so the deeper conversations never happen, and the window to capture a loved ones voice and stories closes quietly and we can't rewind time. We talk about logistics but don't good deep.&nbsp;<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n<div style=\"background:#F8F7F2;border-radius:28px;padding:30px\"><div style=\"font:500 44px/1 'Outfit',sans-serif;letter-spacing:-.02em;margin-bottom:12px\">1 in 5<\u002Fdiv><div style=\"font:400 15px/1.55 'DM Sans',sans-serif;color:#6E695C\">US adults report feeling lonely every day<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F8F7F2;border-radius:28px;padding:30px\"><div style=\"font:500 44px/1 'Outfit',sans-serif;letter-spacing:-.02em;margin-bottom:12px\">304M<\u002Fdiv><div style=\"font:400 15px/1.55 'DM Sans',sans-serif;color:#6E695C\">people live outside the country they were born in, with families split across time zones<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#F6E08C;border-radius:28px;padding:30px;display:flex;align-items:flex-end\"><div style=\"font:400 21px/1.4 'Outfit',sans-serif;letter-spacing:-.01em\">“Most of us are one generation away from losing stories we can never get back.”<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"padding:clamp(72px,10vw,120px) 24px 0;scroll-margin-top:70px\">\n<div style=\"max-width:1120px;margin:0 auto\">\n<div style=\"max-width:620px;margin-bottom:40px\">\n<div style=\"font:500 12.5px/1 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9A9385;margin-bottom:16px\">HOW CHORUS WORKS<\u002Fdiv>\n<h2 style=\"margin:0;font:400 clamp(32px,4vw,44px)/1.12 'Outfit',sans-serif;letter-spacing:-.02em\">No feed. No scroll. No algorithm. Just a question, an answer, and a moment you share.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px\">\n<div style=\"border:1px solid #EFECE3;border-radius:28px;padding:30px\"><span style=\"width:52px;height:52px;border-radius:16px;background:#F6E08C;display:flex;align-items:center;justify-content:center;font:600 20px 'Outfit',sans-serif;margin-bottom:26px\">?<\u002Fspan><div style=\"font:600 20px 'Outfit',sans-serif;margin-bottom:8px\">Ask<\u002Fdiv><div style=\"font:400 15px/1.55 'DM Sans',sans-serif;color:#6E695C\">Every member of the group gets the same question, from a curated theme bank.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #EFECE3;border-radius:28px;padding:30px\"><span style=\"width:52px;height:52px;border-radius:16px;background:#F6E08C;display:flex;align-items:center;justify-content:center;margin-bottom:26px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1A17\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 10a7 7 0 0 0 14 0\"><\u002Fpath><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"21\"><\u002Fline><\u002Fsvg><\u002Fspan><div style=\"font:600 20px 'Outfit',sans-serif;margin-bottom:8px\">Answer<\u002Fdiv><div style=\"font:400 15px/1.55 'DM Sans',sans-serif;color:#6E695C\">You each record a voice answer, up to three minutes. Nobody can hear yours, or anyone else's, yet.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #EFECE3;border-radius:28px;padding:30px\"><span style=\"width:52px;height:52px;border-radius:16px;background:#F6E08C;display:flex;align-items:center;justify-content:center;margin-bottom:26px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1A17\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 0 1 8 0\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font:600 20px 'Outfit',sans-serif;margin-bottom:8px\">Unlock<\u002Fdiv><div style=\"font:400 15px/1.55 'DM Sans',sans-serif;color:#6E695C\">Once everyone's answered, the round unlocks and the whole group listens together.&nbsp;<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"demo\" style=\"padding:clamp(72px,10vw,120px) 20px 0;scroll-margin-top:50px\">\n<div style=\"max-width:1200px;margin:0 auto;background:#FBF3D7;border-radius:40px;padding:clamp(32px,6vw,72px) clamp(20px,5vw,64px)\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px\">\n<div style=\"max-width:560px\">\n<h2 style=\"margin:0 0 12px;font:400 clamp(32px,4vw,44px)/1.12 'Outfit',sans-serif;letter-spacing:-.02em\">Try this week's question<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.6 'DM Sans',sans-serif;color:#615C4F\">This is a real demo of the ritual. Your family (Mum, Dad and Leo) are already waiting on you.<\u002Fp>\n<\u002Fdiv>\n<button sc-camel-on-click=\"{{ shuffle }}\" style=\"height:46px;padding:0 18px;border:none;border-radius:14px;background:#FFFFFF;font:500 14px 'Outfit',sans-serif;color:#1B1A17;cursor:pointer;display:flex;align-items:center;gap:8px\" style-hover=\"background:#F8F7F2\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"17 1 21 5 17 9\"><\u002Fpolyline><path d=\"M3 11V9a4 4 0 0 1 4-4h14\"><\u002Fpath><polyline points=\"7 23 3 19 7 15\"><\u002Fpolyline><path d=\"M21 13v2a4 4 0 0 1-4 4H3\"><\u002Fpath><\u002Fsvg>New question<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"background:#FFFFFF;border-radius:30px;padding:clamp(24px,4vw,44px)\">\n<span style=\"display:inline-block;background:#F6E08C;border-radius:100px;padding:6px 14px;font:500 13px 'Outfit',sans-serif;margin-bottom:18px\">{{ q.theme }}<\u002Fspan>\n<div style=\"font:400 clamp(24px,3vw,32px)/1.28 'Outfit',sans-serif;letter-spacing:-.015em;margin-bottom:28px;max-width:760px;text-wrap:pretty\">{{ q.text }}<\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px\">\n<sc-for list=\"{{ members }}\" as=\"m\" hint-placeholder-count=\"3\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;background:#F8F7F2;border-radius:16px\"><span style=\"width:36px;height:36px;border-radius:12px;background:{{ m.bg }};color:{{ m.fg }};font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center\">{{ m.initial }}<\u002Fspan><div><div style=\"font:500 14px 'Outfit',sans-serif\">{{ m.name }}<\u002Fdiv><div style=\"font:400 12px 'DM Sans',sans-serif;color:#8C8677\">{{ memberStatus }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ pre }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"background:#F8F7F2;border-radius:24px;padding:24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap\">\n<sc-if value=\"{{ idle }}\" hint-placeholder-val=\"{{ true }}\">\n<button sc-camel-on-click=\"{{ mic }}\" style=\"width:84px;height:84px;border-radius:50%;border:none;background:#F6E08C;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0\" style-hover=\"background:#F2D774\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B1A17\" stroke-width=\"1.8\" stroke-linecap=\"round\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 10a7 7 0 0 0 14 0\"><\u002Fpath><line x1=\"12\" y1=\"17\" x2=\"12\" y2=\"21\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ rec }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ mic }}\" style=\"width:84px;height:84px;border-radius:50%;border:none;background:#D9452C;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:ring 1.5s ease-out infinite\"><span style=\"width:24px;height:24px;border-radius:6px;background:#fff;display:block\"><\u002Fspan><\u002Fbutton>\n<div style=\"display:flex;gap:5px;align-items:center;height:48px\"><span style=\"width:6px;height:48px;border-radius:4px;background:#E0A93C;animation:bar 1s ease-in-out infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#F6E08C;animation:bar 1s ease-in-out .1s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#E0A93C;animation:bar 1s ease-in-out .2s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#F6E08C;animation:bar 1s ease-in-out .3s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#E0A93C;animation:bar 1s ease-in-out .4s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#F6E08C;animation:bar 1s ease-in-out .5s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#E0A93C;animation:bar 1s ease-in-out .6s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#F6E08C;animation:bar 1s ease-in-out .7s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#E0A93C;animation:bar 1s ease-in-out .8s infinite\"><\u002Fspan><span style=\"width:6px;height:48px;border-radius:4px;background:#F6E08C;animation:bar 1s ease-in-out .9s infinite\"><\u002Fspan><\u002Fdiv>\n<span style=\"font:500 16px 'Outfit',sans-serif;color:#D9452C\">{{ timer }}<\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{ ready }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"width:84px;height:84px;border-radius:50%;background:#1B1A17;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0\">✓<\u002Fdiv>\n<div><div style=\"font:500 16px 'Outfit',sans-serif;margin-bottom:4px\">Your answer · {{ timer }}<\u002Fdiv><button sc-camel-on-click=\"{{ mic }}\" style=\"background:none;border:none;padding:0;font:400 14px 'DM Sans',sans-serif;color:#8A8263;cursor:pointer;text-decoration:underline\">Record again<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font:400 14.5px/1.55 'DM Sans',sans-serif;color:#6E695C;flex:1;min-width:200px\">{{ hint }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end;margin-top:18px\">\n<button sc-camel-on-click=\"{{ submit }}\" style=\"height:58px;padding:0 30px;border:none;border-radius:20px;background:{{ ctaBg }};color:{{ ctaFg }};font:500 16px 'Outfit',sans-serif;cursor:{{ ctaCursor }}\">Submit and unlock the round<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ unlocking }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#FBF3D7;border-radius:24px;padding:56px 24px;text-align:center\">\n<div style=\"display:flex;gap:6px;align-items:center;height:40px;justify-content:center;margin-bottom:16px\"><span style=\"width:6px;height:40px;border-radius:4px;background:#E0A93C;animation:bar .9s ease-in-out infinite\"><\u002Fspan><span style=\"width:6px;height:40px;border-radius:4px;background:#E0A93C;animation:bar .9s ease-in-out .15s infinite\"><\u002Fspan><span style=\"width:6px;height:40px;border-radius:4px;background:#E0A93C;animation:bar .9s ease-in-out .3s infinite\"><\u002Fspan><span style=\"width:6px;height:40px;border-radius:4px;background:#E0A93C;animation:bar .9s ease-in-out .45s infinite\"><\u002Fspan><span style=\"width:6px;height:40px;border-radius:4px;background:#E0A93C;animation:bar .9s ease-in-out .6s infinite\"><\u002Fspan><\u002Fdiv>\n<div style=\"font:500 17px 'Outfit',sans-serif;color:#6E695C\">Unlocking the round…<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px\">\n<sc-for list=\"{{ answers }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"background:{{ r.card }};border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:34px;height:34px;border-radius:12px;background:{{ r.bg }};color:{{ r.fg }};font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center\">{{ r.initial }}<\u002Fspan><span style=\"font:500 15px 'Outfit',sans-serif\">{{ r.name }}<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;font:400 15px/1.6 'DM Sans',sans-serif;color:#4E4A40;flex:1\">{{ r.text }}<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:12px\">\n<button sc-camel-on-click=\"{{ r.play }}\" style=\"width:46px;height:46px;border-radius:50%;border:none;background:#1B1A17;color:#fff;font-size:13px;cursor:pointer;flex-shrink:0\" style-hover=\"background:#33302A\">{{ r.playIcon }}<\u002Fbutton>\n<div style=\"display:flex;gap:3px;align-items:center;flex:1;height:20px\"><span style=\"width:4px;height:8px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:16px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:11px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:20px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:9px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:15px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:18px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:10px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><span style=\"width:4px;height:14px;border-radius:2px;background:#DFCF9A\"><\u002Fspan><\u002Fdiv>\n<button sc-camel-on-click=\"{{ r.star }}\" title=\"Save to your archive\" style=\"width:44px;height:44px;border:none;border-radius:14px;background:transparent;font-size:20px;color:{{ r.starColor }};cursor:pointer\" style-hover=\"background:rgba(0,0,0,.04)\">{{ r.starIcon }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"archive\" style=\"padding:clamp(72px,10vw,120px) 24px 0\">\n<div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px;align-items:start\">\n<div>\n<h2 style=\"margin:0 0 12px;font:400 clamp(32px,4vw,44px)/1.12 'Outfit',sans-serif;letter-spacing:-.02em\">Your archive<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.6 'DM Sans',sans-serif;color:#6E695C;max-width:420px\">Star an answer during the demo and it's kept here. A taste&nbsp; of Chorus's memory layer.<\u002Fp>\n<\u002Fdiv>\n<div>\n<sc-if value=\"{{ archiveEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border:1.5px dashed #E4E0D4;border-radius:24px;padding:40px 24px;text-align:center;font:400 15px/1.55 'DM Sans',sans-serif;color:#8C8677\">Nothing saved yet. Star an answer above to start your archive.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ archive }}\" as=\"x\" hint-placeholder-count=\"0\">\n<div style=\"background:#F8F7F2;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px\"><span style=\"width:34px;height:34px;border-radius:12px;background:{{ x.bg }};color:{{ x.fg }};font:600 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ x.initial }}<\u002Fspan><div style=\"min-width:0;flex:1\"><div style=\"font:500 14.5px 'Outfit',sans-serif\">{{ x.name }}<\u002Fdiv><div style=\"font:400 13.5px/1.45 'DM Sans',sans-serif;color:#6E695C\">“{{ x.q }}”<\u002Fdiv><\u002Fdiv><span style=\"font:400 12.5px 'DM Sans',sans-serif;color:#9A9385\">{{ x.time }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"waitlist\" style=\"padding:clamp(72px,10vw,120px) 20px 0;scroll-margin-top:50px\">\n<div style=\"max-width:1200px;margin:0 auto;background:#1B1A17;border-radius:40px;padding:clamp(48px,7vw,88px) clamp(24px,6vw,72px);color:#fff;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px;align-items:center\">\n<div>\n<h2 style=\"margin:0 0 14px;font:400 clamp(32px,4vw,46px)/1.1 'Outfit',sans-serif;letter-spacing:-.02em\">The weekly ritual that keeps your family close<\u002Fh2>\n<p style=\"margin:0;font:400 16.5px/1.6 'DM Sans',sans-serif;color:rgba(255,255,255,.72);max-width:440px\">…and keeps their voices forever. Leave your email and we'll let you know when Chorus is ready for your family.<\u002Fp>\n<\u002Fdiv>\n<div>\n<sc-if value=\"{{ notJoined }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n<input type=\"email\" placeholder=\"you@example.com\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"flex:1;min-width:220px;height:58px;border:none;border-radius:20px;background:rgba(255,255,255,.1);padding:0 20px;font:400 16px 'DM Sans',sans-serif;color:#fff;outline:none;box-sizing:border-box\">\n<button sc-camel-on-click=\"{{ join }}\" style=\"height:58px;padding:0 26px;border:none;border-radius:20px;background:#F6E08C;color:#1B1A17;font:500 16px 'Outfit',sans-serif;cursor:pointer\" style-hover=\"background:#FBE9A4\">{{ joinLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ joined }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:rgba(246,224,140,.14);border-radius:20px;padding:20px 22px;font:500 17px 'Outfit',sans-serif;color:#F6E08C\">Thanks, we'll be in touch.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"margin-top:16px;font:400 13px 'DM Sans',sans-serif;color:rgba(255,255,255,.6)\">{{ waitlistNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:56px 24px 72px\">\n<div style=\"max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start\">\n<span style=\"font:600 17px 'Outfit',sans-serif\">Chorus<\u002Fspan>\n<p style=\"margin:0;max-width:560px;font:400 13px/1.6 'DM Sans',sans-serif;color:#8C8677\">Chorus is a concept prototype. Everything in this demo, including your recording and your archive, lives only in your browser and disappears when you close the tab. Nothing is uploaded or sold, ever.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://formspree.io/f/xnpnvbrb&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Waitlist&quot;}}\">\nconst MEMBERS = [\n  { id: 'mum', name: 'Mum', bg: '#EFE4C0', fg: '#6B5E33', pitch: 1.12, rate: 0.95 },\n  { id: 'dad', name: 'Dad', bg: '#DFE6EA', fg: '#54606A', pitch: 0.82, rate: 0.92 },\n  { id: 'leo', name: 'Leo', bg: '#E3EADD', fg: '#57654F', pitch: 1.25, rate: 1.05 }\n];\nconst QUESTIONS = [\n  { theme: 'Family history', text: \"Who in our family history do you wish you'd asked more questions?\", answers: { mum: \"My grandmother. She survived things I only half know about, and I was too young to think to ask before she was gone.\", dad: \"My uncle Sandor. He had a whole life before he came here that none of us ever wrote down.\", leo: \"Honestly? You two. While I still can.\" } },\n  { theme: 'Childhood', text: \"What's a smell that instantly takes you back to being a kid?\", answers: { mum: \"Bread proving on top of the radiator on Sunday mornings. I still can't walk past a bakery without thinking of that kitchen.\", dad: \"Cut grass and two-stroke engine oil, from my father's lawnmower. He let me push it once I was tall enough to see over the handles.\", leo: \"Chlorine. Tuesday swimming lessons, then chips in the car with the windows all steamed up.\" } },\n  { theme: 'Values', text: \"What's the hardest decision you ever made, and would you make it again?\", answers: { mum: \"Leaving my first job to move for your father's work. I cried in the car park. I'd do it again in a heartbeat, but I still think about the version of me who didn't.\", dad: \"Turning down a promotion so I could coach your football team instead. Nobody remembers the job title. Everyone remembers Saturday mornings.\", leo: \"Telling Mum I didn't want to study medicine. Terrifying at the time. Honestly the best conversation we ever had.\" } },\n  { theme: 'Hopes', text: \"What's something you hope never changes about our family?\", answers: { mum: \"That we still argue about the radio in the car. Small, stupid, ours.\", dad: \"Sunday phone calls, even on the weeks there's nothing to say.\", leo: \"That home still smells the same when I visit. Don't ask me to explain that one.\" } },\n  { theme: 'Values', text: \"What's a piece of advice you got that you didn't understand until years later?\", answers: { mum: \"'You won't remember the tidy house, you'll remember who was in it.' Took me two decades and a very messy kitchen to get that.\", dad: \"'Marry someone who makes the boring days good.' I thought that meant exciting. It means kind.\", leo: \"'Nobody's watching as closely as you think they are.' Still working on believing that one.\" } },\n  { theme: 'Values', text: \"What's a moment you felt truly proud of this family?\", answers: { mum: \"The day we all just showed up. No arguments, just showed up. That's rarer than people think.\", dad: \"Watching you figure out something hard without me having to say a word. That's the whole job, really.\", leo: \"Every time we're loud in public and nobody apologises for it.\" } }\n];\n\nclass Component extends DCLogic {\n  state = { qi: 0, phase: 'idle', secs: 0, starred: {}, archive: [], playing: null, email: '', joined: false };\n\n  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.to); if (window.speechSynthesis) speechSynthesis.cancel(); }\n\n  mic() {\n    const p = this.state.phase;\n    if (p === 'idle' || p === 'ready') {\n      clearInterval(this.iv);\n      this.setState({ phase: 'rec', secs: 0 });\n      this.iv = setInterval(() => this.setState(s => {\n        if (s.secs >= 29) { clearInterval(this.iv); return { secs: 30, phase: 'ready' }; }\n        return { secs: s.secs + 1 };\n      }), 1000);\n    } else if (p === 'rec') {\n      clearInterval(this.iv);\n      this.setState(s => ({ phase: 'ready', secs: Math.max(s.secs, 1) }));\n    }\n  }\n  submit() {\n    if (this.state.phase !== 'ready') return;\n    this.setState({ phase: 'unlocking' });\n    this.to = setTimeout(() => this.setState({ phase: 'done' }), 1700);\n  }\n  shuffle() {\n    clearInterval(this.iv); clearTimeout(this.to);\n    if (window.speechSynthesis) speechSynthesis.cancel();\n    this.setState(s => ({ qi: (s.qi + 1 + Math.floor(Math.random() * (QUESTIONS.length - 1))) % QUESTIONS.length, phase: 'idle', secs: 0, starred: {}, playing: null }));\n  }\n  play(p) {\n    const ss = window.speechSynthesis;\n    if (!ss) return;\n    ss.cancel();\n    if (this.state.playing === p.id) { this.setState({ playing: null }); return; }\n    const u = new SpeechSynthesisUtterance(p.speak);\n    u.pitch = p.pitch || 1; u.rate = p.rate || 1;\n    u.onend = () => this.setState(s => s.playing === p.id ? { playing: null } : null);\n    this.setState({ playing: p.id });\n    ss.speak(u);\n  }\n  star(p) {\n    const on = !this.state.starred[p.id];\n    const q = QUESTIONS[this.state.qi].text;\n    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });\n    this.setState(s => ({\n      starred: { ...s.starred, [p.id]: on },\n      archive: on ? [{ key: p.id + s.qi + Date.now(), name: p.name, initial: p.name[0], bg: p.bg, fg: p.fg, q, time }, ...s.archive] : s.archive\n    }));\n  }\n  async join() {\n    const email = this.state.email.trim();\n    if (!/\\S+@\\S+\\.\\S+/.test(email)) { this.setState({ err: 'Please enter a valid email address.' }); return; }\n    const url = (this.props.formEndpoint || 'https://formspree.io/f/xnpnvbrb').trim();\n    if (!url) { this.setState({ err: 'Waitlist not connected yet: add your Formspree endpoint.' }); return; }\n    this.setState({ sending: true, err: '' });\n    try {\n      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ email, source: 'chorus-landing' }) });\n      if (!r.ok) {\n        const d = await r.json().catch(() => ({}));\n        throw new Error((d.errors || []).map(x => x.message).join(' ') || '');\n      }\n      this.setState({ joined: true, sending: false });\n    } catch (e) {\n      this.setState({ sending: false, err: e.message || 'Something went wrong. Please try again.' });\n    }\n  }\n  fmt(n) { return '0:' + String(n).padStart(2, '0'); }\n\n  renderVals() {\n    const { qi, phase, secs, starred, archive, playing } = this.state;\n    const q = QUESTIONS[qi];\n    const hints = {\n      idle: 'Tap the mic to record your answer (max 30 seconds for this demo). Nobody hears it until everyone has answered.',\n      rec: 'Recording… tap again to stop.',\n      ready: 'Recorded. Record again, or submit below to unlock the round.'\n    };\n    const you = { id: 'you', name: 'You', bg: '#F6E08C', fg: '#1B1A17', text: 'Your recorded voice answer · ' + this.fmt(secs), speak: 'This is where your own voice would play back.' };\n    const people = [you, ...MEMBERS.map(m => ({ ...m, text: q.answers[m.id], speak: q.answers[m.id] }))];\n    const ready = phase === 'ready';\n    return {\n      q,\n      members: MEMBERS.map(m => ({ ...m, initial: m.name[0] })),\n      memberStatus: phase === 'done' ? 'Unlocked' : 'Answered · locked',\n      idle: phase === 'idle', rec: phase === 'rec', ready,\n      pre: phase === 'idle' || phase === 'rec' || ready,\n      unlocking: phase === 'unlocking', done: phase === 'done',\n      hint: hints[phase] || '',\n      timer: this.fmt(secs),\n      ctaBg: ready ? '#1B1A17' : '#ECE9E0', ctaFg: ready ? '#FFFFFF' : '#A29C8E', ctaCursor: ready ? 'pointer' : 'not-allowed',\n      mic: () => this.mic(), submit: () => this.submit(), shuffle: () => this.shuffle(),\n      answers: people.map((p, i) => ({\n        ...p, initial: p.name[0], card: i === 0 ? '#FBF3D7' : '#F8F7F2',\n        playIcon: playing === p.id ? '❚❚' : '▶',\n        starIcon: starred[p.id] ? '★' : '☆', starColor: starred[p.id] ? '#E0A93C' : '#B8B2A4',\n        play: () => this.play(p), star: () => this.star(p)\n      })),\n      archive, archiveEmpty: archive.length === 0,\n      email: this.state.email,\n      setEmail: e => this.setState({ email: e.target.value }),\n      join: () => this.join(),\n      joinLabel: this.state.sending ? 'Joining…' : 'Join the waitlist',\n      waitlistNote: this.state.err || \"We'll only email you about Chorus. Unsubscribe anytime.\",\n      joined: this.state.joined, notJoined: !this.state.joined\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
